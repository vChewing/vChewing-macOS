name: unit-test-LibVanguard-WinNT
on:
  workflow_dispatch: {}
  push:
    branches: ["main", "dev/WinNT"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: test-winnt-LibVanguard
    runs-on: windows-latest
    env:
      GIT_SSL_NO_VERIFY: true
    steps:
      - uses: actions/checkout@v4

      # Windows Swift toolchain install
      - name: Setup Swift toolchain (Windows)
        # 建议固定到 tag/sha；这里先按官方示例用 main
        uses: compnerd/gha-setup-swift@main
        with:
          source: swift.org
          # Swift 6.4+ is required: 6.2 / 6.3 are blocked by the manifests
          # (`Package@swift-6.2.swift` / `Package@swift-6.3.swift`), cf. P216 §13.6.
          # Note: the 6.4 series' swift.org identifiers carry the patch zero
          # (`swift-6.4.0-release` / `6.4.0-RELEASE`), unlike the 6.2 / 6.3 series.
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          # 可选：cache: true

      - name: Swift version + run tests (custom package-path)
        shell: pwsh
        run: |
          swift --version
          swift test --no-parallel --package-path ./Packages/vChewing_OSNeutral_LibVanguard/
