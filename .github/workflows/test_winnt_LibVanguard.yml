name: unit-test-LibVanguard-WinNT
on:
  workflow_dispatch: {}
  push:
    branches: ["main", "dev/WinNT"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: test-winnt-LibVanguard
    runs-on: windows-latest
    env:
      GIT_SSL_NO_VERIFY: true
    steps:
      - uses: actions/checkout@v4

      # Windows Swift toolchain install
      - name: Setup Swift toolchain (Windows)
        # 建议固定到 tag/sha；这里先按官方示例用 main
        uses: compnerd/gha-setup-swift@main
        with:
          source: swift.org
          # Swift 6.4+ is required: 6.2 / 6.3 are blocked by the manifests
          # (`Package@swift-6.2.swift` / `Package@swift-6.3.swift`), cf. P216 §13.6.
          # Pin the same 6.4.3-RELEASE as the LibVanguard repo and Linux.
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE
          # 可选：cache: true

      - name: Build tests in release
        shell: pwsh
        run: |
          swift --version
          # Release compilation coverage. `@testable import` needs
          # -enable-testing in release (P289). The test step below runs the
          # release configuration with -Onone, because plain -O discovers zero
          # Swift Testing tests on Windows.
          swift build --build-tests -c release --package-path ./Packages/vChewing_OSNeutral_LibVanguard/ --jobs 1 -Xswiftc -enable-testing

      - name: Run tests (release, unoptimized)
        shell: pwsh
        run: |
          # `-Onone` keeps the Swift Testing content records alive in a release
          # build on Windows; with plain `-O` the runner sees none of them.
          # `--jobs 1` serializes the Windows resource-bundle copy race.
          swift test -c release --package-path ./Packages/vChewing_OSNeutral_LibVanguard/ --jobs 1 -Xswiftc -Onone
