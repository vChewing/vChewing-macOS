name: unit-test-LibVanguard-linux
on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: test-linux-LibVanguard
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: true
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          # Swift 6.4+ is required: 6.2 / 6.3 are blocked by the manifests
          # (`Package@swift-6.2.swift` / `Package@swift-6.3.swift`), cf. P216 §13.6.
          # Semantic-version pin: resolves to the latest 6.4.x release (6.4.0 as of writing).
          swift-version: "6.4"
      - uses: actions/checkout@v1
      - name: Clean
        run: make spmClean
      - name: Test
        run: swift --version && swift test --no-parallel --package-path ./Packages/vChewing_OSNeutral_LibVanguard/
